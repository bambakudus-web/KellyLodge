<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up | KellyLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="logo">Kelly<span class="accent">Lodge</span></div>
    <nav id="site-nav"></nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card-topbar"></div>
      <h2>Create your account</h2>
      <p class="form-note center">Join KellyLodge as a student or a hostel owner.</p>

      <div class="form-error" id="form-error"></div>

      <form id="signup-form">
        <div class="role-toggle">
          <input type="radio" id="role-student" name="role" value="student" checked />
          <label for="role-student">I'm a student</label>
          <input type="radio" id="role-hoster" name="role" value="hoster" />
          <label for="role-hoster">I'm a hostel owner</label>
        </div>

        <div class="form-group icon-field icon-name">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group icon-field icon-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group icon-field icon-phone">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="+233..." required />
        </div>
        <div class="form-group icon-field icon-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="6" required />
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">Show</button>
          <span class="form-note">At least 6 characters.</span>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Create account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="/login.html">Log in</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <strong>KellyLodge</strong>, a student project for Kumasi Technical University.
  </footer>

  <script src="/js/nav.js"></script>
  <script src="/js/auth-form.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
