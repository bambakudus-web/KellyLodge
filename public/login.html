<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — KellyLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="logo">Kelly<span class="accent">Lodge</span></div>
    <nav id="site-nav"></nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="form-note center">Log in to browse, post, or manage listings.</p>

      <div class="form-error" id="form-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-gold btn-block">Log in</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <strong>KellyLodge</strong> — a student project for Kumasi Technical University.
  </footer>

  <script src="/js/nav.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
