<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | KellyLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="logo">Kelly<span class="accent">Lodge</span></div>
    <nav id="site-nav"></nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Set a new password</h2>

      <div class="form-error" id="form-error"></div>
      <div class="form-success" id="form-success"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" minlength="6" required />
          <span class="form-note">At least 6 characters.</span>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-gold btn-block">Reset password</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <strong>KellyLodge</strong>, a student project for Kumasi Technical University.
  </footer>

  <script src="/js/nav.js"></script>
  <script src="/js/csrf.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
